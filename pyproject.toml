[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "org-bloom"
version = "0.1.0"
description = "The org-mode static website-builder. Works with Logseq & Orgamnesia."
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pypandoc>=1.13",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
]

[project.scripts]
org-bloom = "org_bloom.cli:run"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"org_bloom" = ["templates/**/*", "templates/*", "static/**/*", "static/*", "themes/**/*", "themes/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
