# org-bloom.toml
# Place this file (without the .example suffix) at the root of your project
# (Logseq graph, Emacs org-mode folder or Orgamnesia project).
# All keys are optional.
# Priority: CLI options > this file > logseq/config.edn (auto-read).
# Some defaults depend on the project type: a "Logseq graph" has a logseq/
# folder, anything else is an "org-mode project".

[site]

# ── Général ────────────────────────────────────────────────────────────────────

title       = "My Logseq Site"
author      = "First Last"
description = "My personal knowledge base, generated from Logseq."
base_url    = "https://example.com"
lang        = "en"   # HTML lang attribute — used in <html lang="..."> and SEO

# Where to build when no output folder is given on the command line
# (`org-bloom <project>` or `org-bloom build <project>`, as Orgamnesia calls it).
# Relative to the project. ⚠️ Wiped on every build.
# output_dir = "../my-site"

# How to read the project. "auto" (default): a Logseq graph when a logseq/
# folder exists, an org-mode project otherwise. Force it for a folder edited
# with both Logseq and Orgamnesia: "logseq" (pages/ only, logseq/config.edn
# read) or "org" (Orgamnesia, Emacs: subfolders read, config.edn ignored).
# `--source` on the command line overrides it.
# source = "auto"

# Home page slug. Auto-read from config.edn :default-home if absent.
home_page = "home"

# Publish all pages without requiring #+PUBLIC: true; pages with
# #+PUBLIC: false or #+FILETAGS: :noexport: still stay private.
# Default: false for a Logseq graph (auto-read from config.edn
# :publishing/all-pages-public?), true for an org-mode project.
all_public = false

# Org-mode only (Markdown pages are unaffected). Controls whether/how deep
# `*` headings are rendered as plain nested bullet lists instead of heading
# sections — same tree-view lines as any other nested block, just no more
# <h2>/<h3> styling.
#
# Default is "auto": per org page, the deepest `*` level actually used on
# that page becomes a bullet list, and shallower levels above it stay as
# real headings (e.g. `*` stays <h1>, the deepest `**`/`***`/... becomes
# bullets). If a page only uses one heading level (no nesting), that level
# is rendered as plain text instead of a bullet list, since there's nothing
# above it to nest under.
#
# Set to a fixed number N instead to always flatten level >= N (org `***`
# = level 3) regardless of each page's actual depth.
#
# Set to false to disable and render every `*` heading as a real heading.
# Default: "auto" for a Logseq graph, false for an org-mode project.
org_listify_headings_from = "auto"

# Pages and journals directories (auto-read from config.edn if absent).
pages_directory    = "pages"
journals_directory = "journals"

# Paths to exclude from the build (relative to the project root). In an
# org-mode project, hidden folders (.trash, .git…), assets/, logseq/, the
# journals folder and the output folder are never read as pages anyway.
# Auto-read from config.edn :hidden if absent.
# hidden = ["/private", "/drafts/secret.org"]

# ── External static sites ────────────────────────────────────────────────────
# Mini static sites that live in their own repo/folder, outside this Logseq
# project (e.g. something versioned separately). Every immediate subdirectory
# of `path` is copied as-is to the root of the generated site — same
# mechanism as the "Custom HTML/CSS pages" feature for subdirs of pages/,
# just sourced from outside the project. This makes it easy to link to them
# from Logseq with a normal relative link, since the output layout is the
# same either way.
#
# One [[external_static_dirs]] block per external folder:
#
# [[external_static_dirs]]
# path = "/home/you/repo/my-external-project"
#
# [[external_static_dirs]]
# path = "/home/you/repo/another-project"
#
# A relative path is read from the project. On a computer that lacks one of
# these folders (or a pages/ subfolder), links to its HTML pages lead to
# 404.html, with a warning. `org-bloom --no-external-deps` leaves all of them
# out on purpose.

# ── Template ───────────────────────────────────────────────────────────────────

# Theme to apply to the generated site.
# - Built-in themes: "default", "dark", "nord"  (ship with org-bloom)
# - Custom CSS file: path relative to this Logseq project directory, e.g. "themes/my-theme.css"
# Omit or leave commented out to use the built-in default theme.
# theme = "dark"

# Tree view: guide lines connecting nested bullets/headings to their parent,
# with a click-to-collapse button on every branch (style inspired by
# https://iamkate.com/code/tree-views/). Applies to all built-in themes.
# Set to false to fall back to plain nested lists with no lines or folding.
# (Formerly `bullet_threading`, still accepted with a warning.)
tree_view = true

# ── Blog (Logseq journals, org-roam dailies) ─────────────────────────────────

# Enable the blog section built from files in the journals/ directory
# (daily/ for org-roam, used when there is no journals/). In each post,
# #+TITLE, #+DATE and #+AUTHOR override the title, the date and set the author.
# Auto-read from config.edn :feature/enable-journals? if absent.
enable_journals = false

# Title shown on the blog index page and in the nav menu.
blog_title = "Blog"

# Slug of the blog index page (→ blog.html).
blog_slug = "blog"

# Date display format for post titles (Java/Logseq notation).
# Auto-read from config.edn :journal/page-title-format if absent.
# Default: "dd-MM-yyyy" for a Logseq graph; for an org-mode project, the date
# written out in `lang` ("12 octobre 2026"), which "" also selects.
# Examples: "dd-MM-yyyy", "MMM do, yyyy", "EEE dd MMMM yyyy"
journal_page_title_format = "dd-MM-yyyy"

# Date format used in journal filenames (Java/Logseq notation).
# Auto-read from config.edn :journal/file-name-format if absent.
# yyyy-MM-dd (org-roam) and yyyyMMdd (org-journal) names are recognised too.
journal_file_name_format = "yyyy_MM_dd"

# Generate a feed.xml RSS 2.0 file. Requires enable_journals = true.
# A <link rel="alternate"> tag is added to every page <head>.
# Set base_url above for absolute URLs in the feed.
rss = false

# ── Navigation menu ───────────────────────────────────────────────────────────
# Ordered list of nav links. Each entry needs a label (display text) and a
# slug (filename without .html).
# When enable_journals = true, a blog entry is added automatically if the
# blog_slug is not already present here.
#
# An entry with `random = true` (and no slug) is a link to a random published
# page, drawn in the browser from the search index — name it with `label`:
#
# [[menu]]
# label  = "Page au hasard"
# random = true

[[menu]]
label = "Home"
slug  = "home"

[[menu]]
label = "Projects"
slug  = "projects"

[[menu]]
label = "About"
slug  = "about"

# Social links, displayed below the nav menu in the sidebar. The key picks the
# icon (case-insensitive) — recognised names: GitHub, X (or Twitter), Mastodon,
# LinkedIn, Instagram, Facebook, Discord, YouTube, Bluesky, RSS. Unrecognised
# names get a generic link icon, so any other platform still works, just
# without a matching logo.

[social_networks]
GitHub   = "https://github.com/your-username"
Mastodon = "https://mastodon.social/@your-handle"
X        = "https://x.com/your-handle"
Discord  = "https://discord.gg/your-invite"
Facebook = "https://facebook.com/your-page"

# ── Share & print bar ─────────────────────────────────────────────────────────
# Row of buttons under every page title. Each one is on by default: set it to
# false to hide it. With every button off, the bar disappears entirely.
# Share links use base_url when set (canonical URL), else the page's own URL.
# The print button (and Ctrl+P) prints the page alone, without the menu.

[share]
# "horizontal": a row under the page title (default).
# "vertical": a column pinned to the right edge of the screen; on screens
# narrower than 1100px it falls back to the row under the title.
layout    = "horizontal"
native    = true   # device share sheet — only shown where supported (mostly mobile)
whatsapp  = true
facebook  = true
x         = true
bluesky   = true
linkedin  = true
email     = true
copy_link = true
print     = true
